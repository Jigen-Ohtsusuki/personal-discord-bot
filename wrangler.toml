name = "personal-discord-bot"
main = "src/index.js"
compatibility_date = "2024-10-31"

# 24/7 Cloudflare Serverless Cron Trigger (Every 1 minute)
[triggers]
crons = ["* * * * *"]

# KV Namespace for persistent deduplication across all edge PoPs
# Replace <NAMESPACE_ID> with the real ID from Cloudflare Dashboard → Workers & Pages → KV
[[kv_namespaces]]
binding = "JEYSBOT_CACHE"
id = "bdde5185f348484bafc382afb4f5d38e"
